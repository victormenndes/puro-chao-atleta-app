name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerar android/ (Gradle scaffold sempre atualizado)
        run: |
          flutter create --platforms=android \
            --org br.com.mendestechnology.purochao \
            --project-name atleta .
          # `flutter create` num diretório existente só recria os arquivos
          # de plataforma (android/) sem tocar em lib/ ou pubspec.yaml
          # customizados já commitados. Só que ele também grava um
          # test/widget_test.dart boilerplate (referencia MyApp, classe que
          # não existe aqui — o app real é AtletaApp) — quebra o flutter
          # analyze/test se não for removido.
          rm -f test/widget_test.dart

      - name: Ajustar label do app no manifest (best-effort, não falha o build)
        run: |
          sed -i 's/android:label="atleta"/android:label="Puro Chão — Atleta"/' \
            android/app/src/main/AndroidManifest.xml || true

      - name: Adicionar permissão INTERNET no manifest de release
        run: |
          # O template padrão do `flutter create` só inclui INTERNET nos
          # manifests de debug/profile (android/app/src/{debug,profile}/),
          # NÃO no main/ que é usado no build de release — sem isso o app
          # instalado não consegue fazer nenhuma requisição de rede.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n\n    <application/' "$MANIFEST"
          fi
          grep -A1 -B1 "INTERNET" "$MANIFEST"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Gerar ícone adaptativo e splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK release
        run: flutter build apk --release

      - name: Localizar e renomear APK gerado
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          echo "Encontrado: $APK_PATH"
          cp "$APK_PATH" purochao-atleta-unsigned.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: purochao-atleta-unsigned
          path: purochao-atleta-unsigned.apk
          retention-days: 30

      - name: Publicar Release (download público, sem auth)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: purochao-atleta-unsigned.apk
          body: |
            APK gerado automaticamente (build ${{ github.run_number }}, commit ${{ github.sha }}).

            **Este APK NÃO é o de produção.** Ele está assinado com a chave de
            debug pública padrão do Flutter (sem valor de segurança). O
            servidor baixa este artefato e reassina com a chave de release
            real antes de disponibilizar para os atletas em
            static.mendestechnology.com.br.
